apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lnd-ops-workload-baseline
policies:
  - ../kyverno-policy.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: lnd-ops-workload-baseline
    rule: require-digest-pinned-approved-images
    resources: [compliant]
    kind: Pod
    result: pass
  - policy: lnd-ops-workload-baseline
    rule: require-resources
    resources: [compliant]
    kind: Pod
    result: pass
  - policy: lnd-ops-workload-baseline
    rule: require-container-confinement
    resources: [compliant]
    kind: Pod
    result: pass
  - policy: lnd-ops-workload-baseline
    rule: require-runtime-default-seccomp
    resources: [compliant]
    kind: Pod
    result: pass
  - policy: lnd-ops-workload-baseline
    rule: deny-host-and-privileged-access
    resources: [compliant]
    kind: Pod
    result: pass
  - policy: lnd-ops-workload-baseline
    rule: require-digest-pinned-approved-images
    resources: [noncompliant]
    kind: Pod
    result: fail
  - policy: lnd-ops-workload-baseline
    rule: require-resources
    resources: [noncompliant]
    kind: Pod
    result: fail
  - policy: lnd-ops-workload-baseline
    rule: require-container-confinement
    resources: [noncompliant]
    kind: Pod
    result: fail
  - policy: lnd-ops-workload-baseline
    rule: require-runtime-default-seccomp
    resources: [noncompliant]
    kind: Pod
    result: fail
  - policy: lnd-ops-workload-baseline
    rule: deny-host-and-privileged-access
    resources: [noncompliant]
    kind: Pod
    result: fail
