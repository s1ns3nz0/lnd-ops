apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: protected
spec:
  securityContext:
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: docker.io/library/python@sha256:8d9d0b8bcf6506481eae4907c18f5e3e7902e629f5f6d684f9e7c32e85e3ddf0
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Pod
metadata:
  name: noncompliant
  namespace: protected
spec:
  hostNetwork: true
  containers:
    - name: app
      image: docker.io/library/python:latest
      securityContext:
        privileged: true
