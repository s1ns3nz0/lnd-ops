apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lnd-ops-infrastructure
  namespace: lnd-monitoring
  labels:
    release: lnd-ops-monitoring
spec:
  groups:
    - name: lnd-ops-infrastructure
      rules:
        - alert: LndOpsPodNotReady
          expr: kube_pod_status_ready{namespace=~"lnd-regtest|lnd-testnet",condition="false"} == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "LND namespace Pod {{ $labels.namespace }}/{{ $labels.pod }} is not Ready"
            runbook: docs/runbooks/pod-not-ready.md
        - alert: LndOpsGuestDiskLow
          expr: node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"} < 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "K3s guest root filesystem has less than 10% free space"
            runbook: docs/runbooks/guest-disk-low.md
        - alert: LndOpsPVCStorageLow
          expr: kubelet_volume_stats_available_bytes{namespace=~"lnd-regtest|lnd-testnet"} / kubelet_volume_stats_capacity_bytes{namespace=~"lnd-regtest|lnd-testnet"} < 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LND PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 10% free space"
            runbook: docs/runbooks/pvc-storage-low.md
        - alert: LndOpsNodePressure
          expr: kube_node_status_condition{condition=~"DiskPressure|MemoryPressure|PIDPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "K3s node {{ $labels.node }} reports {{ $labels.condition }}"
            runbook: docs/runbooks/node-pressure.md
    - name: lnd-ops-node
      rules:
        - alert: LndOpsWalletLocked
          expr: (lnd_ops_wallet_state{state="LOCKED",namespace=~"lnd-regtest|lnd-testnet"} == 1) and on (namespace, service) (up{job="lnd-wallet-state"} == 1)
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "LND wallet is locked for {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/wallet-locked.md
        - alert: LndOpsWalletStateUnavailable
          expr: up{job="lnd-wallet-state",namespace=~"lnd-regtest|lnd-testnet"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LND wallet state is unavailable for {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/lnd-monitoring-unavailable.md
        - alert: LndOpsChainSyncStalled
          expr: ((lnd_chain_synced{namespace=~"lnd-regtest|lnd-testnet"} == 0) and on (namespace, service) (up{job="lndmon"} == 1)) unless on (namespace, service) (lnd_ops_wallet_state{state=~"LOCKED|NON_EXISTING"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LND chain sync is stalled for {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/chain-sync-stalled.md
        - alert: LndOpsChannelInactive
          expr: ((lnd_channels_inactive_total{namespace=~"lnd-regtest|lnd-testnet"} > 0) and on (namespace, service) (up{job="lndmon"} == 1)) unless on (namespace, service) (lnd_ops_wallet_state{state=~"LOCKED|NON_EXISTING"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "An LND channel is inactive on {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/channel-inactive.md
        - alert: LndOpsLndmonUnavailable
          expr: (up{job="lndmon",namespace=~"lnd-regtest|lnd-testnet"} == 0) unless on (namespace, service) (lnd_ops_wallet_state{state=~"LOCKED|NON_EXISTING"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LND monitoring is unavailable for {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/lnd-monitoring-unavailable.md
        - alert: LndOpsPaymentCollectorUnavailable
          expr: (up{job="lnd-payments",namespace=~"lnd-regtest|lnd-testnet"} == 0) unless on (namespace, service) (lnd_ops_wallet_state{state=~"LOCKED|NON_EXISTING"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Payment collector is unavailable for {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/lnd-monitoring-unavailable.md
        - alert: LndOpsOutgoingLiquidityLow
          expr: (sum by (namespace, service) (lnd_channels_bandwidth_outgoing_sat{status="active"}) < 10000) and on (namespace, service) (lnd_channels_active_total > 0)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LND outbound liquidity is below the 10,000 sat demo target for {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/liquidity-low.md
        - alert: LndOpsIncomingLiquidityLow
          expr: (sum by (namespace, service) (lnd_channels_bandwidth_incoming_sat{status="active"}) < 10000) and on (namespace, service) (lnd_channels_active_total > 0)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LND inbound liquidity is below the 10,000 sat demo target for {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/liquidity-low.md
        - alert: LndOpsRepeatedPaymentFailures
          expr: sum by (namespace, service) (lnd_ops_outgoing_payments_1h{status="FAILED"}) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LND observed at least three failed outgoing payments in the trailing hour for {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/payment-failures.md
        - alert: LndOpsSCBBackupStale
          expr: (lnd_ops_scb_source_present == 1) and on (namespace, service) ((lnd_ops_scb_backup_current == 0) or (lnd_ops_scb_backup_age_seconds > 86400))
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Encrypted SCB is missing, stale, or differs from live LND state for {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/scb-backup-stale.md
    - name: lnd-ops-security
      rules:
        - alert: LndOpsFalcoRuntimeEvent
          expr: increase(falcosecurity_falcosidekick_falco_events_total{rule="LND Ops Runtime Test Event"}[5m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Falco detected the LND Ops runtime test marker"
            runbook: docs/runbooks/falco-runtime-event.md
        - alert: LndOpsTLSCertificateExpiring
          expr: lnd_ops_tls_certificate_expiry_timestamp_seconds - time() < 2592000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LND TLS certificate expires within 30 days for {{ $labels.namespace }}/{{ $labels.service }}"
            runbook: docs/runbooks/tls-certificate-expiring.md
