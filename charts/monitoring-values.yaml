defaultRules:
  create: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
alertmanager:
  alertmanagerSpec:
    image:
      sha: 690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: local-only
      group_by: [alertname, namespace]
      routes: []
    receivers:
      - name: local-only
grafana:
  image:
    sha: 69a5d2d957ca0bba434c160dcd4f2d07de9d6c756a0ba10ae7f52b72ced1e4cc
  sidecar:
    image:
      sha: 2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
  admin:
    existingSecret: lnd-ops-grafana-admin
  service:
    type: ClusterIP
prometheus:
  prometheusSpec:
    image:
      sha: 50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a
    retention: 14d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
    additionalScrapeConfigs:
      - job_name: lndmon
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [lnd-regtest, lnd-testnet]
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: lndmon
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
      - job_name: lnd-grpc
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [lnd-regtest, lnd-testnet]
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: lnd-metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
      - job_name: lnd-payments
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [lnd-regtest, lnd-testnet]
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: payment-metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
      - job_name: lnd-wallet-state
        metrics_path: /wallet-state
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [lnd-regtest, lnd-testnet]
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: payment-metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
      - job_name: lnd-loop-health
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [lnd-testnet]
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: loop-health
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
prometheusOperator:
  image:
    sha: cf153f64d6c38113fceb2cda7642365ea887f71edd7888f054e43e54cf177e55
  prometheusConfigReloader:
    image:
      sha: 142a1f11df8dd165f00375b0b1826aecb9c9adeb05c39855893138d7c7575ff7
  admissionWebhooks:
    patch:
      image:
        sha: cd85a621724cd9043a5b46a784578fa159437712f920166389fce830554e1c44
kube-state-metrics:
  image:
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  collectorsExtra:
    - serviceaccounts
    - roles
    - rolebindings
prometheus-node-exporter:
  # WSL 2 and Lima root mounts are not shared mounts. Node exporter only reads
  # the mounted tree, so recursive host mount propagation is unnecessary.
  hostRootFsMount:
    mountPropagation: None
  image:
    digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    distroless: true
