{{- if .Values.paidScan.enabled }}
{{- $origin := required "paidScan.origin must point to the deployed HTTPS diagnostic projection" .Values.paidScan.origin }}
{{- if not (hasPrefix "https://" $origin) }}
{{- fail "paidScan.origin must use HTTPS" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: paid-scan-diagnostics}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paid-scan-workload-reader
  namespace: {{ .Values.paidScan.namespace | quote }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paid-scan-workload-reader
  namespace: {{ .Values.paidScan.namespace | quote }}
subjects:
  - kind: ServiceAccount
    name: paid-scan-diagnostics
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paid-scan-workload-reader
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: paid-scan-diagnostics}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: paid-scan-diagnostics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: paid-scan-diagnostics}
    spec:
      serviceAccountName: paid-scan-diagnostics
      automountServiceAccountToken: true  # token is for the workload-status tool only
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | quote }}
          command: [python3, /app/paid_scan_diagnostics.py]
          env:
            - {name: PAID_SCAN_DIAGNOSTICS_ORIGIN, value: {{ $origin | quote }}}
            - {name: PAID_SCAN_DIAGNOSTICS_TOKEN_FILE, value: /credentials/token}
            - {name: PAID_SCAN_DIAGNOSTICS_CA_FILE, value: /credentials/ca.crt}
            - {name: OPENCTI_NAMESPACE, value: {{ .Values.paidScan.namespace | quote }}}
            - {name: PROMETHEUS_URL, value: "http://lnd-ops-monitoring-kube-pr-prometheus.lndops-monitoring.svc:9090"}
            - {name: PLAYBOOK_DIR, value: /playbooks}
          ports: [{name: mcp, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: mcp}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: mcp}, periodSeconds: 10}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: source, mountPath: /app, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: playbooks, mountPath: /playbooks, readOnly: true}
      volumes:
        - name: source
          configMap: {name: runbook-gateway-source, defaultMode: 0444}
        - name: playbooks
          configMap: {name: paid-scan-playbooks, defaultMode: 0444}
        - name: credentials
          secret:
            secretName: {{ .Values.paidScan.credentialSecret | quote }}
            defaultMode: 0444
            items: [{key: token, path: token}, {key: ca.crt, path: ca.crt}]
---
apiVersion: v1
kind: Service
metadata: {name: paid-scan-diagnostics}
spec:
  selector: {app.kubernetes.io/name: paid-scan-diagnostics}
  ports: [{name: mcp, port: 8080, targetPort: mcp}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: paid-scan-diagnostics}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: paid-scan-diagnostics}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: lndops-kagent}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.paidScan.namespace | quote }}}}
          podSelector:
            matchLabels: {{- toYaml .Values.paidScan.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.paidScan.port }}}]
    - to:
        - ipBlock: {cidr: {{ .Values.kubeApi.serverCIDR | quote }}}
      ports: [{protocol: TCP, port: {{ .Values.kubeApi.port }}}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: lndops-monitoring}}
      ports: [{protocol: TCP, port: 9090}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-paid-scan-diagnostics
  namespace: lndops-kagent
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}}}
          podSelector: {matchLabels: {app.kubernetes.io/name: paid-scan-diagnostics}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: paid-scan-diagnostics
  namespace: lndops-kagent
spec:
  description: One read-only tenant-scoped paid order diagnostic projection
  protocol: STREAMABLE_HTTP
  url: http://paid-scan-diagnostics.{{ .Release.Namespace }}.svc.cluster.local:8080/mcp
  timeout: 15s
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: paid-scan-diagnosis
  namespace: lndops-kagent
spec:
  description: Explain OpenCTI paid-scan order and L402 (Aperture) payment path state using read-only evidence
  type: Declarative
  declarative:
    runtime: python
    # Tenant data: self-hosted Ollama only; do not make configurable.
    modelConfig: default-model-config
    systemMessage: |
      {{- include "agent.paidScanSystemMessage" . | nindent 6 }}
    tools:
      - type: McpServer
        mcpServer:
          name: paid-scan-diagnostics
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames: [diagnose_paid_order, get_opencti_workload_status, diagnose_l402_funnel, get_playbook]
    deployment:
      replicas: 1
      serviceAccountName: kagent-no-kubernetes-api
---
{{- if .Values.paidScan.eval.enabled }}
# Eval harness: canned scenario outputs behind the same tool schemas. No credentials, no upstream.
apiVersion: apps/v1
kind: Deployment
metadata: {name: paid-scan-eval-fixture}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: paid-scan-eval-fixture}
  template:
    metadata:
      labels: {app.kubernetes.io/name: paid-scan-eval-fixture}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | quote }}
          command: [python3, /app/paid_scan_eval_fixture.py]
          env:
            - {name: PLAYBOOK_DIR, value: /playbooks}
            - {name: SCENARIO_DIR, value: /scenarios}
            - {name: STATE_DIR, value: /state}
          ports: [{name: mcp, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: mcp}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: mcp}, periodSeconds: 10}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: source, mountPath: /app, readOnly: true}
            - {name: playbooks, mountPath: /playbooks, readOnly: true}
            - {name: scenarios, mountPath: /scenarios, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - name: source
          configMap: {name: runbook-gateway-source, defaultMode: 0444}
        - name: playbooks
          configMap: {name: paid-scan-playbooks, defaultMode: 0444}
        - name: scenarios
          configMap: {name: paid-scan-eval-scenarios, defaultMode: 0444}
        - name: state
          emptyDir: {sizeLimit: 1Mi}
---
apiVersion: v1
kind: Service
metadata: {name: paid-scan-eval-fixture}
spec:
  selector: {app.kubernetes.io/name: paid-scan-eval-fixture}
  ports: [{name: mcp, port: 8080, targetPort: mcp}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: paid-scan-eval-fixture}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: paid-scan-eval-fixture}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: lndops-kagent}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-paid-scan-eval
  namespace: lndops-kagent
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}}}
          podSelector: {matchLabels: {app.kubernetes.io/name: paid-scan-eval-fixture}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: paid-scan-eval
  namespace: lndops-kagent
spec:
  description: Canned-scenario stand-in for the paid-scan diagnostics (evaluation only)
  protocol: STREAMABLE_HTTP
  url: http://paid-scan-eval-fixture.{{ .Release.Namespace }}.svc.cluster.local:8080/mcp
  timeout: 15s
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: paid-scan-diagnosis-eval
  namespace: lndops-kagent
spec:
  description: Explain OpenCTI paid-scan order and L402 (Aperture) payment path state using read-only evidence (evaluation copy over canned scenarios)
  type: Declarative
  declarative:
    runtime: python
    # Tenant data: self-hosted Ollama only; do not make configurable.
    modelConfig: default-model-config
    systemMessage: |
      {{- include "agent.paidScanSystemMessage" . | nindent 6 }}
    tools:
      - type: McpServer
        mcpServer:
          name: paid-scan-eval
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames: [diagnose_paid_order, get_opencti_workload_status, diagnose_l402_funnel, get_playbook]
    deployment:
      replicas: 1
      serviceAccountName: kagent-no-kubernetes-api
{{- end }}
{{- end }}
