{{- range $namespace := list "lnd-regtest" "lnd-testnet" "lnd-monitoring" "falco" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runbook-gateway-reader
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [pods, events, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runbook-gateway-reader
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: runbook-gateway
    namespace: lnd-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runbook-gateway-reader
{{- end }}
