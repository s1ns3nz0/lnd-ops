apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- if .Values.monitoring.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          {{- range $i := until (int .Values.lnd.nodes) }}
          - lnd-{{ $i }}
          {{- end }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              lnd-ops-monitoring: "true"
      ports:
        - {protocol: TCP, port: 8989}
        - {protocol: TCP, port: 9092}
        {{- if .Values.monitoring.paymentCollectorImage }}
        - {protocol: TCP, port: 9093}
        {{- end }}
{{- end }}
{{- if gt (int .Values.lnd.nodes) 1 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lnd-peer-traffic
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          {{- range $i := until (int .Values.lnd.nodes) }}
          - lnd-{{ $i }}
          {{- end }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  {{- range $i := until (int .Values.lnd.nodes) }}
                  - lnd-{{ $i }}
                  {{- end }}
      ports:
        - {protocol: TCP, port: 9735}
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  {{- range $i := until (int .Values.lnd.nodes) }}
                  - lnd-{{ $i }}
                  {{- end }}
      ports:
        - {protocol: TCP, port: 9735}
{{- end }}
{{- if eq .Values.profile "testnet" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: testnet-public-traffic
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          {{- range $i := until (int .Values.lnd.nodes) }}
          - lnd-{{ $i }}
          {{- end }}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        {{- range .Values.testnet.publicPeerPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
        - {protocol: TCP, port: 18333}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: testnet-public-p2p-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lnd-0
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 9735}
{{- end }}
{{- if and (eq .Values.profile "testnet") .Values.loop.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loop-to-lnd-rpc
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loopd}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: lnd-0}
      ports:
        - {protocol: TCP, port: 10009}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lnd-from-loop-rpc
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: lnd-0}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: loopd}
      ports:
        - {protocol: TCP, port: 10009}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loop-server-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loopd}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 11010}
{{- if .Values.monitoring.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loop-monitoring-scrape
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loopd}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {lnd-ops-monitoring: "true"}
      ports:
        - {protocol: TCP, port: 9094}
{{- end }}
{{- end }}
{{- if eq .Values.profile "regtest" }}
{{- if .Values.bitcoin.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lnd-to-bitcoin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bitcoin
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  {{- range $i := until (int .Values.lnd.nodes) }}
                  - lnd-{{ $i }}
                  {{- end }}
      ports:
        - {protocol: TCP, port: 18443}
        - {protocol: TCP, port: 28332}
        - {protocol: TCP, port: 28333}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lnd-bitcoin-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          {{- range $i := until (int .Values.lnd.nodes) }}
          - lnd-{{ $i }}
          {{- end }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bitcoin
      ports:
        - {protocol: TCP, port: 18443}
        - {protocol: TCP, port: 28332}
        - {protocol: TCP, port: 28333}
{{- end }}
{{- end }}
