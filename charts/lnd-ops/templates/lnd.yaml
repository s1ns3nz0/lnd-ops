{{- $root := . -}}
{{- range $i := until (int .Values.lnd.nodes) }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: lnd-{{ $i }}
spec:
  selector:
    app.kubernetes.io/name: lnd-{{ $i }}
  ports:
    - {name: rpc, port: 10009, targetPort: 10009}
    - {name: p2p, port: 9735, targetPort: 9735}
    {{- if $root.Values.monitoring.enabled }}
    - {name: lnd-metrics, port: 8989, targetPort: 8989}
    - {name: lndmon, port: 9092, targetPort: 9092}
    {{- if $root.Values.monitoring.paymentCollectorImage }}
    - {name: payment-metrics, port: 9093, targetPort: 9093}
    {{- end }}
    {{- end }}
{{- if and (eq $root.Values.profile "testnet") $root.Values.router.enabled (eq $i 0) }}
---
apiVersion: v1
kind: Service
metadata:
  name: lnd-router-p2p
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: lnd-0
  ports:
    - name: p2p
      port: 9735
      targetPort: 9735
      nodePort: {{ $root.Values.router.p2pNodePort }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lnd-{{ $i }}
spec:
  serviceName: lnd-{{ $i }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lnd-{{ $i }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lnd-{{ $i }}
    spec:
      serviceAccountName: lnd-node
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: lnd
          image: {{ $root.Values.lnd.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --lnddir=/data/.lnd
            {{- if eq $root.Values.profile "regtest" }}
            - --bitcoin.regtest
            - --bitcoin.node=bitcoind
            - --bitcoind.rpchost={{ $root.Values.bitcoin.host }}:18443
            - --bitcoind.rpcuser={{ $root.Values.bitcoin.rpcUser }}
            - --bitcoind.rpcpass={{ $root.Values.bitcoin.rpcPassword }}
            - --bitcoind.zmqpubrawblock=tcp://{{ $root.Values.bitcoin.host }}:28332
            - --bitcoind.zmqpubrawtx=tcp://{{ $root.Values.bitcoin.host }}:28333
            {{- else }}
            - --bitcoin.testnet
            - --bitcoin.node=neutrino
            {{- end }}
            - --rpclisten=0.0.0.0:10009
            - --restlisten=0.0.0.0:8080
            - --listen=0.0.0.0:9735
            {{- if and (eq $root.Values.profile "testnet") $root.Values.router.enabled }}
            - --externalip={{ required "router.externalIP is required when router.enabled=true" $root.Values.router.externalIP }}:9735
            {{- end }}
            - --tlsextraip=127.0.0.1
            # A local client and the separately deployed Loop Pod both verify
            # this certificate. tlsautorefresh adds service DNS safely on a
            # subsequent ordinary chart reapply without changing wallet data.
            - --tlsextradomain=lnd-0
            - --tlsautorefresh
            {{- if $root.Values.monitoring.enabled }}
            - --prometheus.enable
            - --prometheus.listen=0.0.0.0:8989
            {{- end }}
          ports:
            - {name: rpc, containerPort: 10009}
            - {name: p2p, containerPort: 9735}
            {{- if $root.Values.monitoring.enabled }}
            - {name: lnd-metrics, containerPort: 8989}
            {{- end }}
          resources:
            {{- toYaml $root.Values.lnd.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
        {{- if $root.Values.monitoring.enabled }}
        - name: lndmon
          image: {{ $root.Values.monitoring.lndmonImage | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --lnd.host=127.0.0.1:10009
            - --lnd.network={{ $root.Values.profile }}
            - --lnd.macaroondir=/data/.lnd/data/chain/bitcoin/{{ $root.Values.profile }}
            - --lnd.macaroonname=readonly.macaroon
            - --lnd.tlspath=/data/.lnd/tls.cert
            - --prometheus.listenaddr=0.0.0.0:9092
            - --prometheus.logdir=/tmp/lndmon
          ports:
            - {name: lndmon, containerPort: 9092}
          resources:
            {{- toYaml $root.Values.monitoring.lndmonResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
        {{- if $root.Values.monitoring.paymentCollectorImage }}
        - name: payment-metrics
          image: {{ $root.Values.monitoring.paymentCollectorImage | quote }}
          imagePullPolicy: IfNotPresent
          command: [python3, /app/payment_metrics.py]
          env:
            - {name: LND_TLS_CERT, value: /data/.lnd/tls.cert}
            - {name: LND_READONLY_MACAROON, value: /data/.lnd/data/chain/bitcoin/{{ $root.Values.profile }}/readonly.macaroon}
            - {name: LND_SCB_SOURCE, value: /data/.lnd/data/chain/bitcoin/{{ $root.Values.profile }}/channel.backup}
            - {name: LND_BACKUP_STATUS, value: /backup-status/lnd-{{ $i }}.status}
          ports:
            - {name: payment-metrics, containerPort: 9093}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: payment-collector-source, mountPath: /app/payment_metrics.py, subPath: payment_metrics.py, readOnly: true}
            - {name: backup-status, mountPath: /backup-status, readOnly: true}
        {{- end }}
        {{- end }}
      {{- if and $root.Values.monitoring.enabled $root.Values.monitoring.paymentCollectorImage }}
      volumes:
        - name: payment-collector-source
          configMap:
            name: lnd-payment-collector
            defaultMode: 0444
        - name: backup-status
          configMap:
            name: lnd-backup-status
            defaultMode: 0444
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ $root.Values.lnd.storage }}
{{- end }}
