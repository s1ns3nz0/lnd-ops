# promtool `test rules` cases for the opencti-l402-slo group (component health probe, 99.5% SLO, burn-rate alerts).
# Alert `for:` is 0 for FastBurn: the 1h and 5m windows already require ~5 failed probes, so one blip cannot page.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - name: all probes up, nothing fires
    interval: 1m
    input_series:
      - {series: 'probe_success{job="l402-probe",component="pricer"}', values: '1x400'}
      - {series: 'probe_success{job="l402-probe",component="lnd_merchant"}', values: '1x400'}
      - {series: 'probe_success{job="l402-probe",component="aperture"}', values: '1x400'}
    alert_rule_test:
      - {eval_time: 30m, alertname: OpenCTIL402ProbeFastBurn, exp_alerts: []}
      - {eval_time: 390m, alertname: OpenCTIL402ProbeSlowBurn, exp_alerts: []}
      - {eval_time: 390m, alertname: OpenCTIL402ProbeAbsent, exp_alerts: []}
    promql_expr_test:
      - {expr: 'l402_probe:up', eval_time: 30m, exp_samples: [{labels: 'l402_probe:up', value: 1}]}
      - {expr: 'l402_probe:error_ratio_1h', eval_time: 30m, exp_samples: [{labels: 'l402_probe:error_ratio_1h', value: 0}]}
  # detect_at: 75m (failure starts at 70m, after a full hour of healthy history so the 1h window is full)
  - name: pricer probe fails from t=70m, FastBurn fires at 75m, 5 min after the first failed probe (rule chain lags one eval), not at 74m
    interval: 1m
    input_series:
      - {series: 'probe_success{job="l402-probe",component="pricer"}', values: '1x70 0x60'}
      - {series: 'probe_success{job="l402-probe",component="lnd_merchant"}', values: '1x130'}
      - {series: 'probe_success{job="l402-probe",component="aperture"}', values: '1x130'}
    alert_rule_test:
      - {eval_time: 73m, alertname: OpenCTIL402ProbeFastBurn, exp_alerts: []}
      - {eval_time: 74m, alertname: OpenCTIL402ProbeFastBurn, exp_alerts: []}
      - eval_time: 75m
        alertname: OpenCTIL402ProbeFastBurn
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "L402 payment gate probe is burning the 99.5% error budget 14.4x too fast"
              description: "A component of the L402 funnel is failing its health probe. Find it with probe_success{job=\"l402-probe\"} == 0 (component = pricer, lnd_merchant or aperture)."
              runbook_url: docs/playbooks/opencti-l402-funnel.md
  - name: single failed probe does not alert
    interval: 1m
    input_series:
      - {series: 'probe_success{job="l402-probe",component="pricer"}', values: '1x20 0 1x100'}
      - {series: 'probe_success{job="l402-probe",component="lnd_merchant"}', values: '1x121'}
      - {series: 'probe_success{job="l402-probe",component="aperture"}', values: '1x121'}
    alert_rule_test:
      - {eval_time: 21m, alertname: OpenCTIL402ProbeFastBurn, exp_alerts: []}
      - {eval_time: 25m, alertname: OpenCTIL402ProbeFastBurn, exp_alerts: []}
      - {eval_time: 60m, alertname: OpenCTIL402ProbeSlowBurn, exp_alerts: []}
  - name: slow partial failure (1 in 20 probes for 6h) fires SlowBurn, not FastBurn
    interval: 1m
    input_series:
      - {series: 'probe_success{job="l402-probe",component="pricer"}', values: '1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0 1x19 0'}
      - {series: 'probe_success{job="l402-probe",component="lnd_merchant"}', values: '1x400'}
      - {series: 'probe_success{job="l402-probe",component="aperture"}', values: '1x400'}
    alert_rule_test:
      - {eval_time: 370m, alertname: OpenCTIL402ProbeFastBurn, exp_alerts: []}
      - eval_time: 370m
        alertname: OpenCTIL402ProbeSlowBurn
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "L402 payment gate probe is burning the 99.5% error budget 6x too fast"
              description: "A component of the L402 funnel is failing part of its health probes. Find it with probe_success{job=\"l402-probe\"} == 0 (component = pricer, lnd_merchant or aperture)."
              runbook_url: docs/playbooks/opencti-l402-funnel.md
  - name: no probe series fires ProbeAbsent after 10m
    interval: 1m
    input_series:
      - {series: 'probe_success{job="other"}', values: '1x30'}
    alert_rule_test:
      - {eval_time: 5m, alertname: OpenCTIL402ProbeAbsent, exp_alerts: []}
      - eval_time: 12m
        alertname: OpenCTIL402ProbeAbsent
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "L402 probe data is absent; the payment gate is unobserved (no data is not healthy)"
              runbook_url: docs/playbooks/opencti-l402-funnel.md
