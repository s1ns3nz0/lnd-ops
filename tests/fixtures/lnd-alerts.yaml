apiVersion: v1
kind: Pod
metadata:
  name: lnd-ops-alert-fixture
  namespace: lnd-regtest
  labels:
    app.kubernetes.io/name: lnd-ops-alert-fixture
spec:
  serviceAccountName: lnd-ops
  automountServiceAccountToken: false
  containers:
    - name: metrics
      image: __IMAGE__
      imagePullPolicy: Never
      command: [python3, -u, -c]
      args:
        - |
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b'lnd_chain_synced 0\nlnd_channels_inactive_total 1\n'
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain; version=0.0.4')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
          HTTPServer(('0.0.0.0', 9092), Handler).serve_forever()
      ports:
        - {name: lndmon, containerPort: 9092}
---
apiVersion: v1
kind: Service
metadata:
  name: lnd-ops-alert-fixture
  namespace: lnd-regtest
spec:
  selector:
    app.kubernetes.io/name: lnd-ops-alert-fixture
  ports:
    - {name: lndmon, port: 9092, targetPort: 9092}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alert-fixture-scrape
  namespace: lnd-regtest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lnd-ops-alert-fixture
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              lnd-ops-monitoring: "true"
      ports:
        - {protocol: TCP, port: 9092}
