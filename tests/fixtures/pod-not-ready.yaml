apiVersion: v1
kind: Pod
metadata:
  name: lnd-ops-alert-test
  namespace: lnd-regtest
  labels:
    app.kubernetes.io/part-of: lnd-ops-alert-test
spec:
  automountServiceAccountToken: false
  containers:
    - name: deliberately-missing-image
      image: example.invalid/lnd-ops-alert-test:never
      imagePullPolicy: Never
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
