apiVersion: v1
kind: Pod
metadata:
  name: lnd-ops-wallet-fixture
  namespace: lnd-regtest
  labels:
    app.kubernetes.io/name: lnd-ops-wallet-fixture
spec:
  serviceAccountName: lnd-ops
  automountServiceAccountToken: false
  containers:
    - name: metrics
      image: __IMAGE__
      imagePullPolicy: Never
      command: [python3, -u, -c]
      args:
        - |
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.server.server_port == 9092:
                      body = b'lnd_chain_synced 0\nlnd_channels_inactive_total 1\n'
                  elif self.path == '/wallet-state':
                      body = b'lnd_ops_wallet_state{state="LOCKED"} 1\n'
                  else:
                      self.send_error(503)
                      return
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain; version=0.0.4')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
          Thread(target=ThreadingHTTPServer(('0.0.0.0', 9092), Handler).serve_forever, daemon=True).start()
          ThreadingHTTPServer(('0.0.0.0', 9093), Handler).serve_forever()
      ports:
        - {name: lndmon, containerPort: 9092}
        - {name: payment-metrics, containerPort: 9093}
---
apiVersion: v1
kind: Service
metadata:
  name: lnd-ops-wallet-fixture
  namespace: lnd-regtest
spec:
  selector:
    app.kubernetes.io/name: lnd-ops-wallet-fixture
  ports:
    - {name: lndmon, port: 9092, targetPort: 9092}
    - {name: payment-metrics, port: 9093, targetPort: 9093}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wallet-fixture-scrape
  namespace: lnd-regtest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lnd-ops-wallet-fixture
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              lnd-ops-monitoring: "true"
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
